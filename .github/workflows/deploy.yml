name: Deploy lab05-nodejs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/lab05-nodejs
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            npm ci
            npx prisma generate
            npm run build
            pm2 restart nodejs
